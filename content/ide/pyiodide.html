<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>

<script>
  // Elements
  const status   = document.getElementById("status");
  const terminal = document.getElementById("terminal");
  const runBtn   = document.getElementById("runBtn");
  const clearBtn = document.getElementById("clearBtn");
  const codeEl   = document.getElementById("code");

  // Disable browser squiggles in the editor
  codeEl.setAttribute("spellcheck", "false");
  codeEl.setAttribute("autocorrect", "off");
  codeEl.setAttribute("autocapitalize", "off");
  codeEl.setAttribute("autocomplete", "off");
  codeEl.setAttribute("inputmode", "none");

  // Terminal output helpers
  function output(text, className = '') {
    const span = document.createElement('span');
    span.textContent = text;
    if (className) span.className = className;
    terminal.appendChild(span);
    terminal.scrollTop = terminal.scrollHeight;
  }
  function clearOutput() { terminal.innerHTML = ''; }

  // Route WebAgg figures to the terminal
  document.pyodideMplTarget = terminal;

  // --- Prism.js syntax highlighting overlay for the textarea ---
  function loadCSS(href) {
    return new Promise((resolve, reject) => {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.onload = resolve; l.onerror = reject;
      document.head.appendChild(l);
    });
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.defer = true;
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function setupSyntaxHighlighting() {
    // Load Prism core + Python language (no theme!)
    await loadScript('https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-clike.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js');

    // Create overlay wrapper and highlighter <pre><code>
    const wrapper = document.createElement('div');
    wrapper.className = 'editor-wrap';
    wrapper.style.position = 'relative';
    wrapper.style.height = '100%';
    wrapper.style.background = 'var(--brand-bg)';

    const pre = document.createElement('pre');
    pre.className = 'editor-highlight language-python';
    pre.style.position = 'absolute';
    pre.style.inset = '0';
    pre.style.margin = '0';
    pre.style.padding = '1rem';
    pre.style.overflow = 'auto';
    pre.style.pointerEvents = 'none';
    pre.style.whiteSpace = 'pre-wrap';
    pre.style.wordWrap = 'break-word';
    pre.style.border = '0';
    pre.style.borderRadius = '0';
    pre.style.background = 'transparent';
    pre.style.font = 'inherit';  // Use same font as textarea
    pre.style.lineHeight = 'inherit';
    pre.style.fontSize = 'inherit';

    const code = document.createElement('code');
    code.className = 'language-python';
    pre.appendChild(code);

    // Insert wrapper before textarea, then move textarea inside (on top)
    codeEl.parentNode.insertBefore(wrapper, codeEl);
    wrapper.appendChild(pre);
    wrapper.appendChild(codeEl);

    // Make textarea transparent (so syntax layer shows), but keep caret visible
    codeEl.style.background = 'transparent';
    codeEl.style.color = 'transparent';
    codeEl.style.caretColor = 'var(--code-fg)';
    // Ensure padding matches the <pre> padding
    if (!codeEl.style.padding) codeEl.style.padding = '1rem';

    // Sync scroll positions
    function syncScroll() {
      pre.scrollTop  = codeEl.scrollTop;
      pre.scrollLeft = codeEl.scrollLeft;
    }
    codeEl.addEventListener('scroll', syncScroll);

    // Render current code
    function renderHighlight() {
      if (window.Prism?.highlight) {
        code.innerHTML = Prism.highlight(codeEl.value, Prism.languages.python, 'python');
      } else {
        code.textContent = codeEl.value;
      }
      syncScroll();
    }
    codeEl.addEventListener('input', renderHighlight);
    renderHighlight();
  }

  // Make Matplotlib toolbar buttons show hover tooltips & hide inline text
  function enhanceMplToolbar(root = document) {
    root.querySelectorAll('#terminal .mpl-toolbar button.mpl-widget').forEach(btn => {
      let label = (btn.getAttribute('aria-label') || btn.getAttribute('title') || '').trim();
      if (!label) {
        const img = btn.querySelector('img');
        if (img?.getAttribute('alt')) label = img.getAttribute('alt').trim();
        else {
          const svgTitle = btn.querySelector('svg > title');
          if (svgTitle?.textContent) label = svgTitle.textContent.trim();
        }
      }
      if (label) {
        btn.setAttribute('title', label);
        btn.setAttribute('aria-label', label);
      }
      btn.childNodes.forEach(n => { if (n.nodeType === Node.TEXT_NODE) n.textContent = ''; });
    });
  }

  // Watch for new figures/toolbars and enhance automatically
  const obs = new MutationObserver(muts => {
    for (const m of muts) {
      m.addedNodes.forEach(n => {
        if (n instanceof HTMLElement && (n.matches?.('#terminal .mpl-toolbar') || n.querySelector?.('.mpl-toolbar'))) {
          enhanceMplToolbar(n);
        }
      });
    }
  });
  obs.observe(terminal, { childList: true, subtree: true });

  let pyodide = null;

  // Initialize Pyodide (set compact defaults ONCE) + setup syntax highlighting
  (async function init() {
    try {
      // Start syntax highlighting in parallel
      setupSyntaxHighlighting().catch(() => { /* highlighting is optional */ });

      status.textContent = "Loading Pyodide...";
      pyodide = await loadPyodide({
        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.28.2/full/",
        stdout: (text) => output(text + '\n'),
        stderr: (text) => output(text + '\n', 'error')
      });

      status.textContent = "Loading packages...";
      await pyodide.loadPackage(["numpy", "matplotlib"]);

      // Configure Matplotlib defaults once (users can override later)
      await pyodide.runPythonAsync(`
import matplotlib
import matplotlib.pyplot as plt
import sys
matplotlib.use('webagg')
plt.rcParams.update({
    "figure.figsize": (3.8, 2.3),
    "figure.dpi": 120,
    "figure.autolayout": True,
    "font.size": 6,
    "axes.titlesize": 8,
    "axes.labelsize": 6,
    "xtick.labelsize": 6,
    "ytick.labelsize": 6,
    "legend.fontsize": 6,
})
print(f"Python {sys.version.split()[0]}")
print(f"Matplotlib {matplotlib.__version__}")
      `);

      status.textContent = "Ready";
      runBtn.disabled = false;
    } catch (err) {
      status.textContent = "Failed to load";
      output("Error: " + err.toString(), 'error');
    }
  })();

  // Run code
  async function runCode() {
    runBtn.disabled = true;
    status.textContent = "Running...";
    output('\n--- Running ---\n', 'separator');

    const code = codeEl.value;

    try {
      // Close previous figures so they don't re-render
      await pyodide.runPythonAsync(`import matplotlib.pyplot as plt; plt.close('all')`);
      // Execute user code
      await pyodide.runPythonAsync(code);
      // Enhance any newly created toolbars
      enhanceMplToolbar();
    } catch (err) {
      output('\n' + err.toString() + '\n', 'error');
    }

    status.textContent = "Ready";
    runBtn.disabled = false;
  }

  // Events
  runBtn.addEventListener("click", runCode);
  clearBtn.addEventListener("click", clearOutput);
  codeEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.shiftKey) { e.preventDefault(); runCode(); }
  });
</script>
