<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline – App Status</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <style>
      :root {
        --bg: #f5f5f7;
        --fg: #111827;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --card-bg: #ffffff;
        --border: #e5e7eb;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --accent-soft: rgba(37, 99, 235, 0.28);
          --card-bg: #020617;
          --border: #1f2933;
          --shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #e0f2fe 0, var(--bg) 45%);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .shell {
        max-width: 480px;
        width: 100%;
      }

      .card {
        background-color: var(--card-bg);
        border-radius: 1.25rem;
        padding: 1.75rem 1.5rem 1.5rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background-color: var(--accent-soft);
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .badge-icon {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #f97316, #b91c1c);
      }

      .header {
        margin-top: 1.1rem;
        margin-bottom: 0.75rem;
      }

      .title {
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0 0 0.25rem;
      }

      .subtitle {
        margin: 0;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 1.25rem 0 0.5rem;
        padding: 0.7rem 0.9rem;
        border-radius: 0.75rem;
        background-color: rgba(15, 23, 42, 0.04);
      }

      @media (prefers-color-scheme: dark) {
        .status-row {
          background-color: rgba(15, 23, 42, 0.7);
        }
      }

      .status-label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        background-color: #fee2e2;
        color: #b91c1c;
      }

      @media (prefers-color-scheme: dark) {
        .status-pill {
          background-color: rgba(185, 28, 28, 0.15);
          color: #fecaca;
        }
      }

      .status-dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #fecaca, #b91c1c);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }

      button.primary {
        border: none;
        border-radius: 999px;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        transition: transform 0.12s ease, box-shadow 0.12s ease,
          filter 0.12s ease;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      }

      button.primary:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
        box-shadow: 0 10px 28px rgba(37, 99, 235, 0.55);
      }

      button.primary:active {
        transform: translateY(0);
        box-shadow: 0 5px 14px rgba(37, 99, 235, 0.35);
      }

      button.primary:disabled {
        cursor: default;
        filter: grayscale(0.3) brightness(0.95);
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.25);
        opacity: 0.8;
      }

      button.secondary {
        border-radius: 999px;
        padding: 0.55rem 1.1rem;
        font-size: 0.88rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: default;
      }

      .hint {
        margin-top: 1.1rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .hint strong {
        font-weight: 600;
      }

      .meta {
        margin-top: 0.6rem;
        font-size: 0.75rem;
        color: var(--muted);
        opacity: 0.9;
      }

      .meta span {
        opacity: 0.9;
      }

      .meta-dot {
        display: inline-block;
        margin: 0 0.35rem;
        width: 0.2rem;
        height: 0.2rem;
        border-radius: 999px;
        background-color: var(--muted);
        opacity: 0.8;
        vertical-align: middle;
      }
    </style>
  </head>

  <body>
    <main class="shell" aria-labelledby="offline-title">
      <section class="card" role="status" aria-live="polite">
        <div class="badge" aria-hidden="true">
          <span class="badge-icon"></span>
          Offline mode
        </div>

        <header class="header">
          <h1 id="offline-title" class="title">You&rsquo;re offline</h1>
          <p class="subtitle">
            This page is a cached offline version. Any new content will appear
            once you&rsquo;re back online.
          </p>
        </header>

        <div class="status-row">
          <span class="status-label">Connection status</span>
          <span class="status-pill" id="status-pill">
            <span class="status-dot"></span>
            <span id="status-text">Offline</span>
          </span>
        </div>

        <div class="actions">
          <button class="primary" id="retry-btn" type="button">
            <span>Try again</span>
            <span aria-hidden="true">↻</span>
          </button>

          <button class="secondary" type="button" aria-disabled="true">
            Cached view only
          </button>
        </div>

        <p class="hint">
          <strong>Tip:</strong> Reconnect to the internet and choose
          <em>Try again</em> to reload the latest version of this page.
        </p>

        <p class="meta">
          <span></span>
          <span class="meta-dot"></span>
          <span id="updated-at">Last checked just now.</span>
        </p>
      </section>
    </main>

    <script>
      (function () {
        const retryBtn = document.getElementById("retry-btn");
        const statusText = document.getElementById("status-text");
        const statusPill = document.getElementById("status-pill");
        const updatedAt = document.getElementById("updated-at");

        function formatTime(date) {
          return date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        function setOnlineState(isOnline) {
          if (isOnline) {
            statusText.textContent = "Online";
            statusPill.style.backgroundColor = "#dcfce7";
            statusPill.style.color = "#166534";
            updatedAt.textContent =
              "Online – you can reload this page to fetch new content.";
            retryBtn.disabled = false;
          } else {
            statusText.textContent = "Offline";
            statusPill.style.backgroundColor = "";
            statusPill.style.color = "";
            updatedAt.textContent =
              "Last checked at " + formatTime(new Date()) + ".";
            retryBtn.disabled = false; // still allow a manual reload attempt
          }
        }

        retryBtn.addEventListener("click", function () {
          // If we appear to be back online, do a real reload
          if (navigator.onLine) {
            // Full reload to give the service worker a chance to update
            window.location.reload();
          } else {
            // Soft feedback: just update the timestamp
            updatedAt.textContent =
              "Still offline – last checked at " + formatTime(new Date()) + ".";
          }
        });

        window.addEventListener("online", function () {
          setOnlineState(true);
        });

        window.addEventListener("offline", function () {
          setOnlineState(false);
        });

        // Initial state
        setOnlineState(navigator.onLine);
      })();
    </script>
  </body>
</html>
