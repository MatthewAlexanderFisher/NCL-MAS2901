project:
  type: book
  
execute:
  engine: jupyter

jupyter: mas2901

book:
  title: "MAS2901: Statistical Inference"
  author: "Matthew Fisher"
  date: ""
  chapters:
    - index.qmd
    - part: "Part I — Foundations"
      chapters:
        - lectures/part1/0_prob_theory.qmd
        - lectures/part1/1_stat_inference.qmd
        - lectures/part1/2_freq_vs_bayes.qmd
    - part: "Part II — Parameter Estimation"
      chapters:
        - lectures/part2/3_freq_point_estimation.qmd
        - lectures/part2/4_likelihood.qmd
        - lectures/part2/5_bayes_parameter_estimation.qmd
    - part: "Part III - Interval Estimation"
    - part: "Part IV — Hypothesis Testing"
    - part: "Additional Material"
      chapters:
        - appendices/formula_sheet.qmd
        - appendices/revision_sheet.qmd
        - appendices/distribution-explorer.qmd
  # navbar: 
  #   search: true
  sidebar:
    logo: "images/ncl_logo.png"   # path to logo


bibliography: references.bib

# theorems: true   # auto-number + cross-refs for theorem-like blocks

math: 
  renderer: mathjax   # or "katex" if you prefer KaTeX

brand: theming/_brand.yml
format:
  html:
    echo: false
    theme:
      light: light_theme.scss
      dark: dark_theme.scss

    filters:
      - callouty-theorem
    css: 
      - theming/math-scroll.css
      - theming/colors.css
      - theming/floating-code.css

  pdf:
    documentclass: scrreprt

callouty-theorem:
  thm:
    override-title: false # do not override the title of the callout (title won't show when `appearance` set to `simple` or `minimal`)
    callout: # parameters of the wrapping callout. see Quarto documentation of callouts for more details
      type: note
      appearance: minimal
  prp:
    override-title: false
    callout:
      type: note
      appearance: minimal
  exr:
    override-title: false
    callout:
      type: tip
      appearance: minimal
  proof: # also support wrapping proof-like environments
    override-title: true # override the title of the callout by the name of the theorem
    callout:
      type: note
      appearance: default
      collapse: true
      icon: true
  solution:
    override-title: true
    callout:
      type: note
      appearance: default
      collapse: true
      icon: true
  remark:
    override-title: true
    callout:
      type: tip
      appearance: default
      collapse: false
      icon: true
  exm:
    override-title: false
    callout:
      type: caution
      appearance: minimal
      collapse: false
      icon: false

  # theorems types not specified in the metadata will be rendered as is
  cor: default # calloutify corollaries with default style
  def:
    override-title: true
    callout: default # also support default style here


editor:
  render-on-save: true
