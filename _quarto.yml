project:
  type: book
  output-dir: docs
  resources:
    - service-worker.js
    - pwa/manifest.webmanifest
    - pwa/offline.html
    - pwa/icons/*

execute:
  engine: jupyter
  debug: true
  error: true

jupyter: mas2901

book:
  title: "MAS2901: Statistical Inference"
  author: "Matthew Fisher"
  date: ""
  chapters:
    - index.qmd
    - part: "Part I — Foundations"
      chapters:
        - content/main/part1/1-prob-theory.qmd
        - content/main/part1/2-what-is-stats-inference.qmd
        - content/main/part1/3-types-of-inference.qmd
    - part: "Part II — Point Estimation"
      chapters:
        - content/main/part2/4-freq-point-estimation.qmd
        - content/main/part2/5-likelihood.qmd
        - content/main/part2/6-bayes-inference.qmd
    - part: "Part III - Interval Estimation"
      chapters:
        - content/main/part3/7-freq-interval-estimation.qmd
        - content/main/part3/8-bayes-interval-estimation.qmd
    - part: "Part IV — Hypothesis Testing"
      chapters:
        - content/main/part4/9-freq-hypothesis-testing.qmd
        - content/main/part4/10-bayes-hypothesis-testing.qmd
    - part: "Additional Material"
      chapters:
        - content/appendix/formula-sheet.qmd
        - content/appendix/revision-sheet.qmd
        - content/appendix/distribution-explorer.qmd
        - content/appendix/question-bank.qmd
        - content/ide/python-ide.qmd
  sidebar:
    style: floating
    search: true
  navbar: 
    title: ""
    logo: images/ncl_logo_light.png
    search: false
  search:
    location: sidebar
    type: textbox
    keyboard-shortcut: "F"

# bibliography: references.bib

brand: theming/_brand.yml
format:
  html:
    echo: false
    html-math-method: katex
    theme:
      light: light_theme.scss
      dark: dark_theme.scss

    filters:
      - callouty-theorem
    css: 
      - theming/math-scroll.css
      - theming/callout-style.css
      - theming/floating-code.css
      - theming/font.css
      - theming/no-xref-suffix.css
      - theming/scrollbar.css
      - theming/nav-tabs.css
      - theming/header.css
      - theming/question-bank.css
      - theming/sidebar.css
      - theming/lecture-zoom.css
      - theming/visualisation-controls.css
      - theming/tables.css
    include-after-body:
      - theming/no-xref-suffix.html
      - theming/close-codefold.html
      - theming/header.html
      - theming/callout-prefix-removal.html
      - theming/zoom-button.html
      # - js/inkpad.html
    include-in-header: 
      # - theming/favicons.html
      - pwa/pwa-head.html

  pdf:
    documentclass: scrreprt
    echo: false           # Hide all code
    warning: false        # Hide warnings  
    message: false        # Hide messages
    output: true         # Hide computational output (if you want)
    include-in-header:
      text: |
        \usepackage{newunicodechar}
        \usepackage{emoji}
        \newunicodechar{✨}{\emoji{sparkles}}
        \usepackage{amsthm}
        \usepackage{mathtools} 
        \usepackage{hyperref}
        \usepackage{cleveref}
        
        % Define argmax and argmin
        \DeclareMathOperator*{\argmax}{arg\,max}
        \DeclareMathOperator*{\argmin}{arg\,min}
        
        \makeatletter
        \newenvironment{refproof}[1][]%
          {\if\relax\detokenize{#1}\relax
            \begin{proof}
          \else
            % With cleveref:
            %\begin{proof}[Proof of \cref{#1}]
            % Without cleveref:
            \begin{proof}[Proof of \ref{#1}]
          \fi}%
          {\end{proof}}
        \makeatother


callouty-theorem:
  thm:
    override-title: false # do not override the title of the callout (title won't show when `appearance` set to `simple` or `minimal`)
    callout: # parameters of the wrapping callout. see Quarto documentation of callouts for more details
      type: note
      appearance: minimal
  prp:
    override-title: false
    callout:
      type: note
      appearance: minimal
  exr:
    override-title: false
    callout:
      type: tip
      appearance: minimal
  proof: # also support wrapping proof-like environments
    override-title: true # override the title of the callout by the name of the theorem
    callout:
      type: note
      appearance: default
      collapse: true
      icon: true
  solution:
    override-title: true
    callout:
      type: tip
      appearance: default
      collapse: true
      icon: true
  remark:
    override-title: true
    callout:
      type: tip
      appearance: default
      collapse: true
      icon: true
  exm:
    override-title: false
    callout:
      type: caution
      appearance: minimal
      collapse: false

  # theorems types not specified in the metadata will be rendered as is
  cor: default # calloutify corollaries with default style
  def:
    override-title: false
    callout:  # also support default style here
      appearance: minimal
      type: note
      collapse: false

editor:
  render-on-save: true

