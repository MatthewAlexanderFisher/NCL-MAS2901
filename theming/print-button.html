<script>
document.addEventListener('DOMContentLoaded', () => {
  const main = document.querySelector('main.content');
  if (!main) return;
  const defaults = {expandAll: true, pageNumbers: true, chapterInfo: true, layout: 'default', paper: 'A4'};
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  const plainText = node => {
    const copy = node.cloneNode(true);
    copy.querySelectorAll('.katex-html, annotation, .anchorjs-link').forEach(el => el.remove());
    return copy.textContent.replace(/\s+/g, ' ').trim();
  };
  const pageKey = href => {
    const url = new URL(href, location.href);
    url.hash = '';
    url.pathname = url.pathname.replace(/\/index\.html$/, '/');
    return url.href;
  };
  const chapters = () => Array.from(document.querySelectorAll('#quarto-sidebar a.sidebar-link[href]'))
    .filter(link => new URL(link.href).origin === location.origin)
    .map(link => ({href: link.href, title: plainText(link), part: plainText(
      link.closest('.sidebar-item-section')?.querySelector(':scope > .sidebar-item-container .sidebar-item-text') || document.createElement('span'))}));
  const currentChapter = () => chapters().find(ch => pageKey(ch.href) === pageKey(location.href)) ||
    {href: location.href, title: plainText(document.querySelector('h1') || main), part: ''};

  // Track only our mutations so native printing restores panels, tabs and inputs.
  const prepareContent = (root, options) => {
    const undo = [];
    const attribute = (el, name, value) => {
      const old = el.getAttribute(name);
      undo.push(() => old === null ? el.removeAttribute(name) : el.setAttribute(name, old));
      if (value === null) el.removeAttribute(name); else el.setAttribute(name, value);
    };
    if (options.expandAll) {
      root.querySelectorAll('details:not(.code-fold)').forEach(el => attribute(el, 'open', ''));
      root.querySelectorAll('.collapse, .tab-pane').forEach(el => {
        attribute(el, 'class', `${el.className} show${el.matches('.tab-pane') ? ' active' : ''}`);
      });
      root.querySelectorAll('.revision-content[hidden]').forEach(el => attribute(el, 'hidden', null));
    }
    root.querySelectorAll('.tab-pane').forEach(panel => {
      const label = root.querySelector(`[id="${CSS.escape(panel.getAttribute('aria-labelledby') || '')}"]`);
      if (!label) return;
      const heading = root.ownerDocument.createElement('div');
      heading.className = 'print-tab-heading'; heading.textContent = plainText(label);
      panel.prepend(heading); undo.push(() => heading.remove());
    });
    root.querySelectorAll('input, select, textarea').forEach(input => {
      if (input.type === 'hidden' || input.closest('.filterbox')) return;
      attribute(input, 'class', `${input.className} print-original-control`);
      if (input.type === 'range' && input.closest('form')?.querySelector('input[type="number"]')) return;
      const value = root.ownerDocument.createElement('span');
      value.className = 'print-control-value';
      value.textContent = input.matches('select') ? Array.from(input.selectedOptions).map(o => o.textContent).join(', ') :
        ['checkbox', 'radio'].includes(input.type) ? (input.checked ? 'Yes' : 'No') : input.value;
      input.before(value); undo.push(() => value.remove());
    });
    return () => undo.reverse().forEach(restore => restore());
  };

  const paperStyle = (doc, options) => {
    const margin = options.layout === 'compact' ? 12 : options.layout === 'wide' ? 10 : 17;
    const paper = options.paper === 'Letter' ? 'letter' : 'A4';
    const width = (paper === 'letter' ? 215.9 : 210) - 2 * margin;
    doc.body.style.setProperty('--print-content-width', `${width}mm`);
    const style = doc.createElement('style');
    style.dataset.printSettings = '';
    style.textContent = `@media print { @page {
      size: ${paper}; margin: 18mm ${margin}mm;
      @top-left { content: ${options.chapterInfo ? '"MAS2901 · Statistical Inference"' : 'none'}; font: 8pt sans-serif; color: #555; }
      @bottom-right { content: ${options.pageNumbers ? 'counter(page)' : 'none'}; font: 8pt sans-serif; color: #555; }
    } }`;
    doc.head.append(style);
    return style;
  };

  const fitContent = root => {
    const undo = [];
    root.querySelectorAll('.math.display, .table-scroll').forEach(wrapper => {
      const content = wrapper.matches('.math.display') ? wrapper.querySelector('.katex') : wrapper.querySelector('table');
      if (!content || !wrapper.clientWidth) return;
      const width = Math.max(content.scrollWidth, content.getBoundingClientRect().width);
      if (width > wrapper.clientWidth + 1) {
        const old = content.style.zoom;
        content.style.zoom = String((wrapper.clientWidth - 2) / width);
        undo.push(() => { content.style.zoom = old; });
      }
    });
    root.querySelectorAll('figure, .ojs-plot-panel, .callout, .controls-root, .ojs-toolbar-grid').forEach(el => {
      const height = el.getBoundingClientRect().height;
      // Long proofs and figure collections must be allowed to flow across pages.
      if (height > 0 && height < (el.matches('.callout') ? 220 : 650) && !el.classList.contains('print-keep-together')) {
        el.classList.add('print-keep-together');
        undo.push(() => el.classList.remove('print-keep-together'));
      }
    });
    return () => undo.reverse().forEach(restore => restore());
  };

  const waitForContent = async doc => {
    const deadline = Date.now() + 30000;
    // Wait for Quarto imports and Observable computations rather than a guessed delay.
    let settled = 0;
    while (settled < 2) {
      if (Date.now() > deadline) throw new Error('Interactive figures are still loading. Please wait and try again.');
      // Quarto leaves its import class on fulfilled cells when no imports were
      // needed. Hidden empty cells also occur when a view is moved into a layout.
      // A hidden viewof value may await its first input forever even though the
      // visible chart has rendered. Readiness concerns printable outputs only.
      settled = doc.querySelector('.ojs-in-a-box-waiting-for-module-import:empty:not(.quarto-ojs-hide), .observablehq--running:not(.quarto-ojs-hide)') ? 0 : settled + 1;
      await delay(150);
    }
    if (doc.querySelector('.observablehq--error')) throw new Error('A figure could not load. Reload the chapter before printing.');
    await Promise.race([doc.fonts.ready, delay(15000).then(() => { throw new Error('Fonts did not finish loading. Please try again.'); })]);
    const images = Array.from(doc.querySelectorAll('main img')).filter(img => !img.closest('.quarto-dark-content, .dark-content'));
    images.forEach(img => { img.loading = 'eager'; });
    await Promise.race([
      Promise.all(images.map(img => new Promise((resolve, reject) => {
        const check = () => img.naturalWidth ? resolve() : reject(new Error('An image could not load. Please reload the chapter.'));
        // decode() can remain pending on images adopted from another document.
        // Complete, successfully loaded images are already ready for printing.
        if (img.complete) check();
        else { img.addEventListener('load', check, {once: true}); img.addEventListener('error', check, {once: true}); }
      }))),
      delay(15000).then(() => { throw new Error('Images did not finish loading. Please try again.'); })
    ]);
  };

  const snapshot = (doc, chapter) => {
    const source = doc.querySelector('main.content');
    if (!source) throw new Error(`No lecture content found in ${chapter.title}.`);
    const clone = source.cloneNode(true);
    const originals = source.querySelectorAll('input, select, textarea');
    clone.querySelectorAll('input, select, textarea').forEach((input, i) => {
      input.value = originals[i].value;
      if ('checked' in input) input.checked = originals[i].checked;
    });
    // CodeMirror only renders its visible lines. Preserve the complete code in
    // the printed IDE, including edits made before opening the print options.
    const editorBody = clone.querySelector('#editor .body');
    if (editorBody && doc.getElementById('code')) {
      const pre = doc.createElement('pre');
      pre.textContent = doc.defaultView.cmEditor?.getValue() ?? doc.getElementById('code').value;
      editorBody.replaceChildren(pre);
      clone.querySelector('#status')?.remove();
    }
    const canvases = source.querySelectorAll('canvas');
    clone.querySelectorAll('canvas').forEach((canvas, i) => {
      const img = doc.createElement('img');
      img.src = canvases[i].toDataURL();
      img.alt = canvases[i].getAttribute('aria-label') || 'Snapshot of the interactive figure';
      img.width = canvases[i].width; img.height = canvases[i].height; img.className = 'figure-img';
      canvas.replaceWith(img);
    });
    clone.querySelectorAll('img:not([src^="data:"])').forEach(img => {
      img.src = new URL(img.getAttribute('src'), doc.baseURI).href;
      img.removeAttribute('srcset'); img.removeAttribute('sizes'); img.loading = 'eager';
    });
    clone.querySelectorAll('a[href], image[href], image[xlink\\:href]').forEach(el => {
      const attr = el.hasAttribute('href') ? 'href' : 'xlink:href';
      el.setAttribute(attr, new URL(el.getAttribute(attr), doc.baseURI).href);
    });
    clone.querySelectorAll('script, .anchorjs-link, .quarto-dark-content, .dark-content').forEach(el => el.remove());
    return {chapter, clone};
  };

  const namespaceChapters = pages => {
    const destinations = new Map();
    pages.forEach(({chapter, clone}, index) => {
      const prefix = `print-ch${index + 1}-`;
      const ids = new Map();
      clone.querySelectorAll('[id]').forEach(el => { ids.set(el.id, prefix + el.id); el.id = prefix + el.id; });
      clone.id = `${prefix}content`;
      destinations.set(pageKey(chapter.href), {ids, id: clone.id});
      clone.querySelectorAll('*').forEach(el => {
        ['aria-labelledby', 'aria-describedby', 'aria-controls', 'for'].forEach(attr => {
          if (el.hasAttribute(attr)) el.setAttribute(attr, el.getAttribute(attr).split(/\s+/).map(id => ids.get(id) || id).join(' '));
        });
        for (const attr of el.attributes) {
          if (attr.value.includes('url(#')) el.setAttribute(attr.name, attr.value.replace(/url\(#([^)]*)\)/g, (match, id) => `url(#${ids.get(id) || id})`));
          if (el.namespaceURI === 'http://www.w3.org/2000/svg' && ['href', 'xlink:href'].includes(attr.name) && attr.value.startsWith('#')) {
            el.setAttribute(attr.name, `#${ids.get(attr.value.slice(1)) || attr.value.slice(1)}`);
          }
        }
      });
    });
    pages.forEach(({clone}) => clone.querySelectorAll('a[href]').forEach(link => {
      const url = new URL(link.href);
      const target = destinations.get(pageKey(url.href));
      if (!target) return;
      const id = url.hash ? target.ids.get(decodeURIComponent(url.hash.slice(1))) : target.id;
      if (id) link.setAttribute('href', `#${id}`);
    }));
  };

  const createPrintWindow = () => {
    // Open during the click, before asynchronous loading, to avoid popup blocking.
    const win = window.open('', '_blank');
    if (!win) throw new Error('Please allow the print preview window, then try again.');
    win.document.open();
    win.document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MAS2901 print preview</title></head><body><p role="status">Preparing lecture notes…</p></body></html>');
    win.document.close();
    return win;
  };

  const assemble = async (win, pages, options) => {
    if (win.closed) throw new Error('The print preview was closed.');
    const doc = win.document;
    doc.documentElement.style.setProperty('font-size', '11pt', 'important');
    const seen = new Set();
    const pendingStyles = [];
    document.querySelectorAll('link[rel="stylesheet"], link[rel="disabled-stylesheet"]').forEach(link => {
      if (link.classList.contains('quarto-color-alternate') || link.dataset.mode === 'dark' || seen.has(link.href)) return;
      seen.add(link.href);
      const copy = doc.createElement('link'); copy.rel = 'stylesheet'; copy.href = link.href;
      pendingStyles.push(new Promise((resolve, reject) => {
        copy.onload = resolve;
        copy.onerror = () => reject(new Error('Print styles could not load. Please try again.'));
      }));
      doc.head.append(copy);
    });
    const stylesReady = Promise.all(pendingStyles);
    doc.body.replaceChildren();
    doc.body.className = `print-document print-layout-${options.layout}`;
    paperStyle(doc, options);
    const toolbar = doc.createElement('div'); toolbar.className = 'print-view-toolbar';
    toolbar.innerHTML = '<button type="button">Print / Save PDF</button><p>Use “Save as PDF” in the print dialog. Turn off browser headers and footers to avoid duplicate page furniture.</p>';
    toolbar.querySelector('button').addEventListener('click', () => win.print()); doc.body.append(toolbar);
    pages.forEach(({clone}) => prepareContent(clone, options));
    namespaceChapters(pages);
    const book = doc.createElement('main'); book.className = 'content'; book.id = 'quarto-document-content';
    pages.forEach(({clone}) => {
      const section = doc.createElement('section'); section.className = 'print-chapter'; section.id = clone.id;
      section.append(...Array.from(clone.childNodes)); book.append(section);
    });
    doc.body.append(book);
    await Promise.race([stylesReady, delay(15000).then(() => { throw new Error('Print styles did not finish loading. Please try again.'); })]);
    await waitForContent(doc);
    fitContent(book);
    doc.body.dataset.printReady = 'true';
    doc.title = pages.length === 1 ? `${pages[0].chapter.title} — MAS2901` : 'MAS2901 — Selected lecture notes';
    win.focus(); win.print();
  };

  const loadChapter = (iframe, href) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('A chapter took too long to load. Please try again.')), 30000);
    iframe.onload = () => {
      clearTimeout(timer);
      if (!iframe.contentDocument?.querySelector('main.content')) reject(new Error('A chapter could not be loaded.'));
      else resolve(iframe.contentDocument);
    };
    iframe.onerror = () => { clearTimeout(timer); reject(new Error('A chapter could not be loaded.')); };
    iframe.src = href;
  });

  const showOptions = () => {
    if (document.querySelector('#print-options-dialog')) return;
    const current = currentChapter(); const list = chapters();
    const dialog = document.createElement('dialog');
    dialog.id = 'print-options-dialog'; dialog.className = 'print-dialog';
    dialog.setAttribute('aria-labelledby', 'print-options-title');
    dialog.innerHTML = `
      <h2 id="print-options-title">Print or save as PDF</h2>
      <p>A paper layout with dark text on white. Figures are saved as static snapshots.</p>
      <div class="print-option"><label>Print scope: <select id="print-scope">
        <option value="current">Current chapter</option><option value="part">Current part</option>
        <option value="selected">Selected chapters</option><option value="all">Entire book</option>
      </select></label></div>
      <fieldset id="chapter-selection" class="chapter-list" hidden><legend>Select chapters</legend></fieldset>
      <div class="print-option"><label><input type="checkbox" id="print-expand-all" checked> Include collapsed explanations and all tabs</label></div>
      <div class="print-option"><label><input type="checkbox" id="print-page-numbers" checked> Add page numbers</label></div>
      <div class="print-option"><label><input type="checkbox" id="print-chapter-info" checked> Add course heading in the page margin</label></div>
      <div class="print-option"><label>Paper: <select id="print-paper"><option value="A4">A4</option><option value="Letter">US Letter</option></select></label></div>
      <div class="print-option"><label>Layout: <select id="print-layout"><option value="default">Standard</option><option value="compact">Compact text</option><option value="wide">Wider text area</option></select></label></div>
      <p class="print-progress" role="status" aria-live="polite"></p>
      <div class="print-actions"><button type="button" class="btn-print-cancel">Cancel</button><button type="button" class="btn-print-confirm">Prepare PDF / Print</button></div>`;
    const selection = dialog.querySelector('#chapter-selection');
    list.forEach(chapter => {
      const label = document.createElement('label'); const input = document.createElement('input');
      input.type = 'checkbox'; input.value = chapter.href;
      label.append(input, document.createTextNode(chapter.title)); selection.append(label);
    });
    if (!current.part) dialog.querySelector('option[value="part"]').disabled = true;
    const scope = dialog.querySelector('#print-scope');
    scope.addEventListener('change', () => { selection.hidden = scope.value !== 'selected'; });
    const status = dialog.querySelector('.print-progress'); const confirm = dialog.querySelector('.btn-print-confirm');
    let cancelled = false; let preview;
    dialog.addEventListener('close', () => {
      cancelled = true;
      if (preview && !preview.closed && preview.document.body.dataset.printReady !== 'true') preview.close();
      dialog.remove();
    });
    dialog.querySelector('.btn-print-cancel').addEventListener('click', () => dialog.close());
    confirm.addEventListener('click', async () => {
      const options = {
        expandAll: dialog.querySelector('#print-expand-all').checked,
        pageNumbers: dialog.querySelector('#print-page-numbers').checked,
        chapterInfo: dialog.querySelector('#print-chapter-info').checked,
        layout: dialog.querySelector('#print-layout').value,
        paper: dialog.querySelector('#print-paper').value
      };
      const selected = new Set(Array.from(selection.querySelectorAll('input:checked')).map(el => el.value));
      const requested = scope.value === 'current' ? [current] : scope.value === 'part' ? list.filter(ch => ch.part === current.part) :
        scope.value === 'selected' ? list.filter(ch => selected.has(ch.href)) : list;
      if (!requested.length) { status.textContent = 'Select at least one chapter.'; return; }
      let iframe;
      try {
        preview = createPrintWindow(); confirm.disabled = true; status.classList.remove('print-error');
        const pages = [];
        for (const chapter of requested) {
          if (cancelled || preview.closed) throw new Error('Print preparation cancelled.');
          status.textContent = `Preparing ${pages.length + 1} of ${requested.length}: ${chapter.title}`;
          let doc = document;
          if (pageKey(chapter.href) !== pageKey(location.href)) {
            if (!iframe) {
              iframe = document.createElement('iframe');
              iframe.title = 'Preparing print content'; iframe.setAttribute('aria-hidden', 'true'); iframe.tabIndex = -1;
              iframe.style.cssText = 'position:fixed;left:-10000px;top:0;width:1000px;height:1000px;visibility:hidden;';
              document.body.append(iframe);
            }
            doc = await loadChapter(iframe, chapter.href);
          }
          await waitForContent(doc); pages.push(snapshot(doc, chapter));
        }
        if (cancelled || preview.closed) throw new Error('Print preparation cancelled.');
        status.textContent = 'Laying out the pages…';
        await assemble(preview, pages, options); dialog.close();
      } catch (error) {
        if (preview && !preview.closed) preview.close();
        if (!cancelled) { status.textContent = error.message; status.classList.add('print-error'); confirm.disabled = false; }
      } finally { iframe?.remove(); }
    });
    document.body.append(dialog); dialog.showModal();
  };

  const tools = document.querySelector('#quarto-header .quarto-navbar-tools');
  if (tools) {
    const button = document.createElement('button');
    button.id = 'print-pdf-header-toggle'; button.className = 'btn-print-pdf'; button.type = 'button';
    button.setAttribute('aria-label', 'Print or save as PDF'); button.title = 'Print or save as PDF';
    button.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>';
    tools.append(button); button.addEventListener('click', showOptions);
  }

  // Native browser Print uses the same layout and restores state after dismissal.
  let restoreNative;
  window.addEventListener('beforeprint', () => {
    if (restoreNative) return;
    const oldClass = document.body.className; const oldStyle = document.body.getAttribute('style');
    const oldRootClass = document.documentElement.className;
    document.documentElement.classList.remove('reading-mode', 'lecture-zoom');
    document.body.classList.remove('reading-mode', 'lecture-zoom');
    document.body.classList.add('print-document');
    const style = paperStyle(document, defaults);
    const restoreContent = prepareContent(main, defaults); const restoreFit = fitContent(main);
    restoreNative = () => {
      restoreFit(); restoreContent(); style.remove(); document.body.className = oldClass;
      document.documentElement.className = oldRootClass;
      if (oldStyle === null) document.body.removeAttribute('style'); else document.body.setAttribute('style', oldStyle);
      restoreNative = null;
    };
  });
  window.addEventListener('afterprint', () => restoreNative?.());
});
</script>
