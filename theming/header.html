<script>
document.addEventListener('DOMContentLoaded', function () {
  const tools = document.querySelector('#quarto-header .quarto-navbar-tools');
  if (!tools) return;

  // Create settings container
  const settingsContainer = document.createElement('div');
  settingsContainer.className = 'settings-dropdown';
  settingsContainer.innerHTML = `
    <button class="btn-settings" type="button" aria-label="Display settings" title="Display settings">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <div class="settings-menu">
      <p class="settings-section-label">Display Mode</p>
      <button class="settings-item" id="lecture-zoom-toggle" type="button">
        <span class="settings-icon">
          <svg class="icon-enter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <svg class="icon-exit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </span>
        <span class="settings-label">Lecture Zoom</span>
        <span class="settings-status"></span>
      </button>
      <button class="settings-item" id="reading-mode-toggle" type="button">
        <span class="settings-icon">
          <svg class="icon-enter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <svg class="icon-exit" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </span>
        <span class="settings-label">Reading Mode</span>
        <span class="settings-status"></span>
      </button>
      
      <div class="settings-divider"></div>
      <p class="settings-section-label">Custom Colors</p>
      
      <div class="settings-color-row">
        <label for="settings-bg-color">Background</label>
        <input type="color" id="settings-bg-color" class="settings-color-input">
      </div>

      <div class="settings-color-row">
        <label for="settings-text-color">Text</label>
        <input type="color" id="settings-text-color" class="settings-color-input">
      </div>

      <div class="settings-color-row">
        <label for="settings-accent-color">Accent</label>
        <input type="color" id="settings-accent-color" class="settings-color-input">
      </div>    
        
      <button class="settings-reset-btn" id="reset-colors" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        Reset Colors
      </button>
    </div>
  `;

  // Insert after color toggle
  const colorToggle = tools.querySelector('.quarto-color-scheme-toggle');
  if (colorToggle && colorToggle.parentNode) {
    colorToggle.parentNode.insertBefore(settingsContainer, colorToggle.nextSibling);
  } else {
    tools.appendChild(settingsContainer);
  }

  // Elements
  const settingsBtn = settingsContainer.querySelector('.btn-settings');
  const lectureZoomToggle = settingsContainer.querySelector('#lecture-zoom-toggle');
  const readingModeToggle = settingsContainer.querySelector('#reading-mode-toggle');
  const bgColorInput = settingsContainer.querySelector('#settings-bg-color');
  const textColorInput = settingsContainer.querySelector('#settings-text-color');
  const accentColorInput = settingsContainer.querySelector('#settings-accent-color');
  const resetColorsBtn = settingsContainer.querySelector('#reset-colors');

  // Default color values
  const defaultBgColor = '#fafaf8';
  const defaultTextColor = '#1a1a1a';
  const defaultAccentColor = '#0d6efd';

  // ============================
  // Helper Functions (define first)
  // ============================
  
  // Helper function to darken a hex color
  const darkenColor = (hex, amount) => {
    hex = hex.replace('#', '');
    let r = parseInt(hex.substring(0, 2), 16);
    let g = parseInt(hex.substring(2, 4), 16);
    let b = parseInt(hex.substring(4, 6), 16);
    r = Math.max(0, Math.floor(r * (1 - amount)));
    g = Math.max(0, Math.floor(g * (1 - amount)));
    b = Math.max(0, Math.floor(b * (1 - amount)));
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
  };

  // Helper function to lighten a hex color
  const lightenColor = (hex, amount) => {
    hex = hex.replace('#', '');
    let r = parseInt(hex.substring(0, 2), 16);
    let g = parseInt(hex.substring(2, 4), 16);
    let b = parseInt(hex.substring(4, 6), 16);
    r = Math.min(255, Math.floor(r + (255 - r) * amount));
    g = Math.min(255, Math.floor(g + (255 - g) * amount));
    b = Math.min(255, Math.floor(b + (255 - b) * amount));
    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
  };

  // Reading progress indicator
  const updateReadingProgress = () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    document.body.style.setProperty('--scroll-progress', `${progress}%`);
  };

  // Update visual states for display modes
  const updateActiveStates = () => {
    const isLectureZoom = document.body.classList.contains('lecture-zoom');
    const isReadingMode = document.body.classList.contains('reading-mode');
    lectureZoomToggle.classList.toggle('active', isLectureZoom);
    readingModeToggle.classList.toggle('active', isReadingMode);
  };

  // Apply custom colors
  const applyCustomColors = () => {
    document.body.classList.add('custom-colors');
    
    const bgColor = bgColorInput.value;
    const textColor = textColorInput.value;
    const accentColor = accentColorInput.value;
    
    document.documentElement.style.setProperty('--custom-bg-color', bgColor);
    document.documentElement.style.setProperty('--custom-text-color', textColor);
    document.documentElement.style.setProperty('--custom-accent-color', accentColor);
    
    // Compute darker scrollbar thumb color (30% darker)
    const darkerThumb = darkenColor(bgColor, 0.3);
    document.documentElement.style.setProperty('--scroll-track', bgColor);
    document.documentElement.style.setProperty('--scroll-thumb', darkerThumb);
    
    // Compute lighter variants for callouts and tabs
    const lighterBg = lightenColor(bgColor, 0.3);
    const lighterBgSubtle = lightenColor(bgColor, 0.15);
    document.documentElement.style.setProperty('--custom-bg-lighter', lighterBg);
    document.documentElement.style.setProperty('--custom-bg-lighter-subtle', lighterBgSubtle);
    
    // Save to localStorage
    localStorage.setItem('mas2901-custom-bg', bgColor);
    localStorage.setItem('mas2901-custom-text', textColor);
    localStorage.setItem('mas2901-custom-accent', accentColor);
  };

  // Reset colors to defaults
  const resetColors = () => {
    document.body.classList.remove('custom-colors');
    document.documentElement.style.removeProperty('--custom-bg-color');
    document.documentElement.style.removeProperty('--custom-text-color');
    document.documentElement.style.removeProperty('--custom-accent-color');
    document.documentElement.style.removeProperty('--scroll-track');
    document.documentElement.style.removeProperty('--scroll-thumb');
    document.documentElement.style.removeProperty('--custom-bg-lighter');
    document.documentElement.style.removeProperty('--custom-bg-lighter-subtle');
    
    // Reset inputs to defaults
    bgColorInput.value = defaultBgColor;
    textColorInput.value = defaultTextColor;
    accentColorInput.value = defaultAccentColor;
    
    // Clear localStorage
    localStorage.removeItem('mas2901-custom-bg');
    localStorage.removeItem('mas2901-custom-text');
    localStorage.removeItem('mas2901-custom-accent');
  };

  // ============================
  // Event Listeners
  // ============================

  // Toggle dropdown
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsContainer.classList.toggle('open');
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!settingsContainer.contains(e.target)) {
      settingsContainer.classList.remove('open');
    }
  });

  // Close on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      settingsContainer.classList.remove('open');
    }
  });

  // Lecture Zoom toggle
  lectureZoomToggle.addEventListener('click', () => {
    // Turn off reading mode if active
    if (document.body.classList.contains('reading-mode')) {
      document.body.classList.remove('reading-mode');
      document.documentElement.classList.remove('reading-mode');
      window.removeEventListener('scroll', updateReadingProgress);
      document.body.style.removeProperty('--scroll-progress');
    }

    document.body.classList.toggle('lecture-zoom');
    document.documentElement.classList.toggle('lecture-zoom');
    updateActiveStates();
  });

  // Reading Mode toggle
  readingModeToggle.addEventListener('click', () => {
    // Turn off lecture zoom if active
    if (document.body.classList.contains('lecture-zoom')) {
      document.body.classList.remove('lecture-zoom');
      document.documentElement.classList.remove('lecture-zoom');
    }

    document.body.classList.toggle('reading-mode');
    document.documentElement.classList.toggle('reading-mode');

    // Update progress indicator on scroll
    if (document.body.classList.contains('reading-mode')) {
      updateReadingProgress();
      window.addEventListener('scroll', updateReadingProgress);
    } else {
      window.removeEventListener('scroll', updateReadingProgress);
      document.body.style.removeProperty('--scroll-progress');
    }
    
    updateActiveStates();
  });

  // Color input listeners
  bgColorInput.addEventListener('input', applyCustomColors);
  textColorInput.addEventListener('input', applyCustomColors);
  accentColorInput.addEventListener('input', applyCustomColors);

  // Reset colors button
  resetColorsBtn.addEventListener('click', resetColors);

  // ============================
  // Initialize
  // ============================

  // Load saved colors or use defaults
  const savedBg = localStorage.getItem('mas2901-custom-bg');
  const savedText = localStorage.getItem('mas2901-custom-text');
  const savedAccent = localStorage.getItem('mas2901-custom-accent');

  // Set input values (saved or default)
  bgColorInput.value = savedBg || defaultBgColor;
  textColorInput.value = savedText || defaultTextColor;
  accentColorInput.value = savedAccent || defaultAccentColor;

  // Apply custom colors if any were saved
  if (savedBg || savedText || savedAccent) {
    applyCustomColors();
  }

  // Initial display mode state
  updateActiveStates();
});
</script>
