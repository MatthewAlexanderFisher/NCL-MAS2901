<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>
  (function () {
    // Compute book root for both environments
    function computeRoots() {
      const onPages = /github\.io$/i.test(location.hostname);
      // >>>> CHANGE THIS to your repo name <<<<
      const repoBase = '/NCL-MAS2901/';

      if (onPages) {
        // Absolute path from origin for GitHub Pages (works on any deep page)
        const rootPath = repoBase.endsWith('/') ? repoBase : repoBase + '/';
        const abs = location.origin + rootPath;
        return { rootPath, abs };
      } else {
        // Local preview: use Quarto's basePath
        const basePath = (window.quartoConfig && window.quartoConfig.basePath) ? window.quartoConfig.basePath : './';
        const u = new URL(basePath, window.location.href);
        const rootPath = u.pathname.endsWith('/') ? u.pathname : u.pathname + '/';
        const abs = location.origin + rootPath;
        return { rootPath, abs };
      }
    }

    function appendOrReplace(selector, makeEl) {
      const existing = document.querySelector(selector);
      if (existing) existing.remove();
      document.head.appendChild(makeEl());
    }

    const roots = computeRoots();

    // Inject links ASAP (don’t wait for load)
    appendOrReplace('link[rel="manifest"]', () => {
      const l = document.createElement('link');
      l.rel = 'manifest';
      l.href = roots.abs + 'pwa/manifest.webmanifest';
      return l;
    });

    // Favicons (tab icons)
    appendOrReplace('link[rel="icon"][sizes="16x16"]', () => {
      const l = document.createElement('link');
      l.rel = 'icon'; l.type = 'image/png'; l.sizes = '16x16';
      l.href = roots.abs + 'pwa/icons/icon-16.png';
      return l;
    });
    appendOrReplace('link[rel="icon"][sizes="32x32"]', () => {
      const l = document.createElement('link');
      l.rel = 'icon'; l.type = 'image/png'; l.sizes = '32x32';
      l.href = roots.abs + 'pwa/icons/icon-32.png';
      return l;
    });
    // Legacy ICO (optional)
    appendOrReplace('link[rel="icon"][type="image/x-icon"]', () => {
      const l = document.createElement('link');
      l.rel = 'icon'; l.type = 'image/x-icon';
      l.href = roots.abs + 'pwa/icons/favicon.ico';
      return l;
    });

    // Apple touch icon
    appendOrReplace('link[rel="apple-touch-icon"]', () => {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = roots.abs + 'pwa/icons/icon-180.png';
      return l;
    });

    // Register SW (use absolute URL on Pages)
    if ('serviceWorker' in navigator) {
      const swUrl = roots.abs + 'service-worker.js';
      navigator.serviceWorker.register(swUrl, { scope: roots.rootPath })
        .catch(err => console.error('SW registration failed:', err));
    }
  })();
</script>
