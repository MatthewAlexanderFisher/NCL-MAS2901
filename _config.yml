# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: MAS2xxx - Notes
author: Dr Matthew Fisher
logo: logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

options:
  numbered: true  # Enables numbered sections in the content
  number_toc: true  # Enables numbered sections in the table of contents

sphinx:
  extra_extensions:
    - sphinxcontrib.tikz
    - sphinx_proof

  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    tikz_proc_suite: 'pdf2svg'
    tikz_transparent: True
    html_extra_path: ['assets']
    html_static_path: ["_static"]

    numfig: true
    numfig_secnum_depth: 1

    proof_theorem_types:
      definition: "Definition"
      example: "Example"
      theorem: "Theorem"
      lemma: "Lemma"
      corollary: "Corollary"
      remark: "Remark"


# sphinx:
#   config:
#     proof_default_options:
#       number: True  # Ensure automatic numbering


# Information about where the book exists on the web
repository:
  url: https://github.com/executablebooks/jupyter-book  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: false
  favicon: _static/favicon.ico  # Adjust the path as needed
  extra_css: ["_static/custom.css"]
  # use_multitoc_numbering: false
